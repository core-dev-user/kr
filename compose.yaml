services:
  db:
    image: postgres:17-alpine
    ports: ['127.0.0.1:5432:5432']
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: lingua_local
      POSTGRES_DB: lingua
    volumes: ['lingua_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lingua -d lingua']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  lingua_data:
